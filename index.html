<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KHAASCORE AI – Autonomous Legal & Compliance OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #030712; color: #f3f4f6; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 16px; }
    
    .nav-bar { display: flex; justify-content: space-between; gap: 8px; }
    .pill-btn { background: rgba(6, 78, 59, 0.4); border: 1px solid #059669; color: #34d399; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    
    .card { background: #081528; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    
    .status-row { display: flex; justify-content: space-between; align-items: center; }
    .score-badge { font-size: 28px; font-weight: 800; color: #10b981; }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
    .stat-box { background: #040c18; border: 1px solid #0f233d; border-radius: 10px; padding: 12px; text-align: center; }
    .stat-val { font-size: 14px; font-weight: 700; color: #38bdf8; margin-top: 4px; }
    
    .input-label { font-weight: 700; color: #f9fafb; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 15px; }
    textarea { width: 100%; height: 130px; background: #030a14; border: 1px solid #0284c7; border-radius: 10px; padding: 12px; color: #e0f2fe; font-size: 13px; resize: none; outline: none; }
    
    .audit-btn { width: 100%; margin-top: 14px; background: linear-gradient(135deg, #10b981, #06b6d4); color: #000; font-weight: 800; font-size: 15px; padding: 14px; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 0 15px rgba(16,185,129,0.4); }
    .audit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .result-box { display: none; margin-top: 16px; background: #040e1a; border: 1px solid #10b981; border-radius: 10px; padding: 16px; font-size: 13px; line-height: 1.6; color: #d1fae5; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav-bar">
      <div class="pill-btn">⚡ 6-Vector Suite</div>
      <div class="pill-btn" style="border-color:#38bdf8; color:#38bdf8;">💳 Enterprise Plans</div>
    </div>

    <div class="card">
      <div class="status-row">
        <div>
          <div style="font-size: 13px; color: #34d399; font-weight: 700;">● TIER-0 SOVEREIGN RUNTIME</div>
          <div style="font-size: 11px; color: #9ca3af;">Deterministic Multi-Cloud Immunity</div>
        </div>
        <div class="score-badge" id="mainScore">600<span style="font-size:14px; color:#9ca3af;">/600</span></div>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div style="font-size: 10px; color: #9ca3af;">CONSENSUS</div>
          <div class="stat-val" style="color:#34d399;">6/6 Optimal</div>
        </div>
        <div class="stat-box">
          <div style="font-size: 10px; color: #9ca3af;">LATENCY</div>
          <div class="stat-val" id="latencyVal">&lt; 0.63 ms</div>
        </div>
        <div class="stat-box">
          <div style="font-size: 10px; color: #9ca3af;">THROUGHPUT</div>
          <div class="stat-val">4907 op/s</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="input-label">
        <span>⚡ Enterprise Document Ingestion</span>
        <span style="font-size: 10px; color: #34d399; border: 1px solid #059669; padding: 2px 6px; border-radius: 4px;">PARALLEL READY</span>
      </div>
      
      <textarea id="contractInput" placeholder="Paste data sharing clauses, vendor agreements, algorithmic trading logic, or enterprise privacy terms here..."></textarea>
      
      <button id="scanBtn" class="audit-btn" onclick="runComplianceScan()">⚡ RUN AI COMPLIANCE AUDIT</button>

      <div id="resultContainer" class="result-box"></div>
    </div>
  </div>

  <script>
    async function runComplianceScan() {
      const text = document.getElementById('contractInput').value;
      const button = document.getElementById('scanBtn');
      const resultBox = document.getElementById('resultContainer');
      
      if (!text.trim()) {
        alert("कृपया पहले बॉक्स में कोई क्लॉज या टेक्स्ट पेस्ट करें।");
        return;
      }

      button.innerText = "⚡ AUDITING VECTORS WITH GEMINI...";
      button.disabled = true;
      resultBox.style.display = "none";

      try {
        const startTime = Date.now();
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        const data = await response.json();
        const duration = ((Date.now() - startTime) / 1000).toFixed(2);

        document.getElementById('latencyVal').innerText = duration + " s";
        
        resultBox.style.display = "block";
        if (data.result) {
          resultBox.innerText = "📋 AUDIT REPORT:\n\n" + data.result;
        } else if (data.error) {
          resultBox.innerText = "❌ Error: " + data.error;
        } else {
          resultBox.innerText = JSON.stringify(data, null, 2);
        }

        button.innerText = "✓ AUDIT COMPLETE (RUN AGAIN)";
      } catch (err) {
        resultBox.style.display = "block";
        resultBox.innerText = "❌ Network / Server Error: " + err.message;
        button.innerText = "⚡ RUN AI COMPLIANCE AUDIT";
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
