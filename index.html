<!DOCTYPE html>
<html lang="hi" class="select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: wss:; img-src 'self' https: data:; font-src 'self' https: data:;">
  <meta name="author" content="Kamran Siddiki">
  <title>Khaascore AI — Autonomous Neural Studio OS</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 500: '#4f46e5', 600: '#4338ca', accent: '#0284c7' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    html { scroll-behavior: smooth; }
    body { background-color: #f8fafc; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; overflow-x: hidden; -webkit-user-select: none; user-select: none; }
    #neuralCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.12; }
    
    .glass-panel-light {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(15, 23, 42, 0.04);
    }

    .apple-action-btn-light {
      background: rgba(15, 23, 42, 0.03);
      border: 1px solid rgba(15, 23, 42, 0.08);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .apple-action-btn-light:hover {
      background: rgba(79, 70, 229, 0.08);
      border-color: rgba(79, 70, 229, 0.3);
      transform: translateY(-1px);
    }

    .teleprompter-active { position: fixed; inset: 0; z-index: 9999; background: #ffffff; padding: 4rem 2rem; overflow-y: scroll; scroll-behavior: smooth; font-size: 2rem; line-height: 2.3; color: #0f172a; }
    .voice-wave-bar { animation: soundWave 1.2s infinite ease-in-out alternate; }
    @keyframes soundWave { 0% { height: 4px; } 100% { height: 24px; } }
    ::selection { background: #4f46e5; color: #ffffff; }
    
    #securityLockOverlay { display: none; position: fixed; inset: 0; z-index: 999999; background: #ffffff; color: #ef4444; flex-direction: column; align-items: center; justify-content: center; font-family: monospace; text-align: center; padding: 20px; }
  </style>
</head>
<body class="min-h-screen flex flex-col relative justify-between" oncontextmenu="return false;">

  <div id="securityLockOverlay">
    <i class="fa-solid fa-triangle-exclamation text-6xl mb-4 animate-bounce text-red-500"></i>
    <h1 class="text-2xl font-black tracking-widest uppercase mb-2">SECURITY BREACH PREVENTED</h1>
    <p class="text-xs text-slate-500 max-w-sm">अनधिकृत टूल्स और डिबगिंग ब्लॉक कर दिए गए हैं।</p>
    <span class="mt-4 text-[11px] font-mono text-indigo-600">ARCHITECT: KAMRAN SIDDIKI</span>
  </div>

  <canvas id="neuralCanvas"></canvas>

  <header class="w-full glass-panel-light border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-sky-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-brain text-white text-lg"></i>
        </div>
        <div>
          <span class="text-lg font-black tracking-tight text-slate-900 block">Khaascore <span class="text-indigo-600 font-light">AI</span></span>
          <span class="text-[9px] font-mono text-indigo-600 uppercase tracking-widest block">Autonomous Neural Core</span>
        </div>
      </div>

      <button onclick="alert('फाउंडर प्रोटोकॉल: Khaascore AI के एकमात्र आर्किटेक्ट और विजनरी Kamran Siddiki हैं।')" class="apple-action-btn-light text-xs font-bold text-slate-800 px-4 py-2 rounded-xl flex items-center space-x-2">
        <i class="fa-solid fa-fingerprint text-indigo-600"></i>
        <span>फाउंडर</span>
      </button>
    </div>
  </header>

  <main class="w-full max-w-4xl mx-auto px-6 py-6 flex-1 flex flex-col space-y-6 relative z-10">

    <section class="glass-panel-light rounded-3xl p-6 sm:p-8 flex-1 flex flex-col relative overflow-hidden min-h-[450px]">
      
      <div class="flex items-center justify-between border-b border-slate-200 pb-4 mb-4 text-xs text-slate-500">
        <div class="flex items-center space-x-2.5">
          <span class="w-2.5 h-2.5 rounded-full bg-indigo-600 animate-ping"></span>
          <span class="font-mono text-xs text-indigo-600 font-semibold tracking-wide">LIVE NEURAL STREAM</span>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="toggleTeleprompter()" class="apple-action-btn-light px-3.5 py-1.5 rounded-xl text-slate-700 text-xs transition font-medium">
            <i class="fa-solid fa-desktop mr-1.5 text-indigo-600"></i> टेलीप्रॉम्प्टर
          </button>
          <button onclick="playNeuralSpeech()" class="apple-action-btn-light px-3.5 py-1.5 rounded-xl text-slate-700 text-xs transition font-medium">
            <i class="fa-solid fa-headphones mr-1.5 text-sky-600"></i> सुनें
          </button>
          <button onclick="copyOutput()" class="apple-action-btn-light px-3.5 py-1.5 rounded-xl text-slate-700 text-xs transition font-medium">
            <i class="fa-solid fa-copy mr-1.5 text-emerald-600"></i> कॉपी
          </button>
        </div>
      </div>

      <div id="thinkingState" class="hidden my-auto text-center space-y-4 py-24">
        <div class="inline-flex p-5 rounded-3xl bg-indigo-50 border border-indigo-200 shadow-sm">
          <i class="fa-solid fa-atom text-4xl text-indigo-600 animate-spin"></i>
        </div>
        <p id="thinkingStep" class="text-xs font-mono text-indigo-600 tracking-wider">[क्वांटम प्रोसेसिंग जारी...]</p>
      </div>

      <div id="outputConsole" class="flex-1 overflow-y-auto text-base sm:text-lg leading-relaxed space-y-4 whitespace-pre-wrap text-slate-900 font-normal selection:bg-indigo-500 selection:text-white">
        <div class="text-slate-500 text-center py-28 font-light space-y-3">
          <i class="fa-solid fa-bolt text-5xl mb-3 block text-indigo-600 animate-pulse"></i>
          <p class="text-xl font-bold text-slate-900 tracking-tight">Khaascore AI न्यूरल कोर ऑनलाइन है।</p>
          <p class="text-sm text-slate-500 max-w-md mx-auto">बिना किसी मोड को चुने, नीचे सीधे अपना सवाल दर्ज करें।</p>
        </div>
      </div>

      <div id="nextStepsRow" class="hidden mt-4 pt-4 border-t border-slate-200 flex flex-wrap gap-2.5">
        <button onclick="injectNext('इसे और अधिक विस्तार से समझाओ')" class="apple-action-btn-light text-xs px-3.5 py-2 rounded-xl text-indigo-700 font-medium transition">
          🚀 इसे और विस्तार दें
        </button>
        <button onclick="injectNext('इसमें क्या तकनीकी कमियाँ हैं, उन्हें सुधारो')" class="apple-action-btn-light text-xs px-3.5 py-2 rounded-xl text-indigo-700 font-medium transition">
          ⚙️ तकनीकी सुधार सुझाएं
        </button>
      </div>
    </section>

    <section class="glass-panel-light p-4 rounded-3xl relative shadow-xl">
      <div id="voiceWaveBar" class="hidden pb-2.5 px-2 flex items-center space-x-1.5 justify-center">
        <span class="text-[11px] font-mono text-indigo-600 mr-2 tracking-wider">सुन रहा हूँ...</span>
        <div class="w-1 bg-indigo-600 voice-wave-bar rounded-full" style="animation-delay: 0.1s"></div>
        <div class="w-1 bg-indigo-600 voice-wave-bar rounded-full" style="animation-delay: 0.3s"></div>
        <div class="w-1 bg-indigo-600 voice-wave-bar rounded-full" style="animation-delay: 0.2s"></div>
      </div>

      <div class="flex items-end space-x-3">
        <div class="flex-1 relative">
          <textarea id="promptBox" rows="2" placeholder="यहाँ कुछ भी पूछें... (ऑटोनॉमस न्यूरल इंजन सक्रिय)" class="w-full bg-white text-base text-slate-900 placeholder-slate-400 rounded-2xl p-4 focus:outline-none border border-slate-200 focus:border-indigo-600 resize-none transition shadow-inner font-normal"></textarea>
        </div>
        <button onclick="toggleVoiceInput()" id="micBtn" class="apple-action-btn-light h-14 w-14 rounded-2xl text-slate-700 flex items-center justify-center transition flex-shrink-0 text-lg">
          <i class="fa-solid fa-microphone"></i>
        </button>
        <button onclick="executeEngine()" class="h-14 w-14 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-sky-400 hover:opacity-90 text-white flex items-center justify-center transition shadow-xl shadow-indigo-500/30 flex-shrink-0 text-lg">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && (e.key === 'u' || e.key === 's'))) {
        e.preventDefault();
        triggerSecurityLock();
        return false;
      }
    });

    function triggerSecurityLock() {
      document.getElementById('securityLockOverlay').style.display = 'flex';
      setInterval(() => { Function("debugger")(); }, 50);
    }

    const BACKEND_URL = "https://khaascore-ai-backend-1.onrender.com";
    let audioCtx = null;
    let recognition = null;

    const canvas = document.getElementById('neuralCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.radius = 1.5;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#4f46e5';
        ctx.fill();
      }
    }

    for (let i = 0; i < 35; i++) particles.push(new Particle());

    function animateNeural() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(79, 70, 229, ${1 - dist / 120})`;
            ctx.lineWidth = 0.4;
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animateNeural);
    }
    animateNeural();

    function playHaptic() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(700, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      } catch (e) {}
    }

    function triggerThinking(active) {
      const state = document.getElementById('thinkingState');
      const out = document.getElementById('outputConsole');
      const text = document.getElementById('thinkingStep');
      if (active) {
        state.classList.remove('hidden');
        out.classList.add('hidden');
        const steps = ["[क्वांटम सिक्योरिटी स्कैन...]", "[ऑटोनॉमस न्यूरल प्रोसेसिंग...]", "[जीरो-एरर सिंथेसिस...]"];
        let i = 0;
        window.thinkInterval = setInterval(() => {
          i = (i + 1) % steps.length;
          text.textContent = steps[i];
        }, 500);
      } else {
        clearInterval(window.thinkInterval);
        state.classList.add('hidden');
        out.classList.remove('hidden');
      }
    }

    async function executeEngine() {
      playHaptic();
      const input = document.getElementById('promptBox');
      const prompt = input.value.trim();
      if (!prompt) return;

      const output = document.getElementById('outputConsole');
      const nextSteps = document.getElementById('nextStepsRow');

      nextSteps.classList.add('hidden');
      output.textContent = '';
      triggerThinking(true);

      const endpoints = [
        `${BACKEND_URL}/api/generate/stream`,
        "https://khaascore-ai-backend-1.onrender.com/api/generate/stream"
      ];

      let success = false;

      for (const endpoint of endpoints) {
        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer guest_token' },
            body: JSON.stringify({ prompt: prompt, tool: 'general', persona: 'shark' })
          });

          if (!res.ok) continue;

          triggerThinking(false);
          success = true;
          const reader = res.body.getReader();
          const decoder = new TextDecoder('utf-8');

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value);
            const lines = chunk.split('\n');
            for (const line of lines) {
              if (line.startsWith('data: ')) {
                try {
                  const parsed = JSON.parse(line.replace('data: ', ''));
                  if (parsed.type === 'stream_chunk') output.textContent += parsed.payload.chunk;
                  if (parsed.type === 'error') output.textContent = parsed.payload.message;
                } catch(e) {}
              }
            }
          }
          break;
        } catch (err) {}
      }

      if (!success) {
        triggerThinking(false);
        output.textContent = "न्यूरल क्लस्टर री-कनेक्ट हो रहा है... कृपया एक सेकंड रुककर दोबारा कमांड दें। (सर्वर स्लीप मोड से जाग रहा है)";
      } else {
        nextSteps.classList.remove('hidden');
      }
    }

    function injectNext(text) {
      document.getElementById('promptBox').value = text;
      executeEngine();
    }

    function toggleVoiceInput() {
      playHaptic();
      const wave = document.getElementById('voiceWaveBar');
      const micBtn = document.getElementById('micBtn');

      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('वॉयस इनपुट समर्थित नहीं है।');
        return;
      }

      if (recognition && recognition.running) {
        recognition.stop();
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.continuous = false;

      recognition.onstart = () => {
        recognition.running = true;
        wave.classList.remove('hidden');
        micBtn.classList.add('text-indigo-600', 'border-indigo-600');
      };
      recognition.onresult = (e) => {
        document.getElementById('promptBox').value = e.results[0][0].transcript;
      };
      recognition.onend = () => {
        recognition.running = false;
        wave.classList.add('hidden');
        micBtn.classList.remove('text-indigo-600', 'border-indigo-600');
      };
      recognition.start();
    }

    function toggleTeleprompter() {
      const out = document.getElementById('outputConsole');
      out.classList.toggle('teleprompter-active');
      if (out.classList.contains('teleprompter-active')) {
        window.teleScroll = setInterval(() => { out.scrollTop += 1; }, 35);
      } else {
        clearInterval(window.teleScroll);
      }
    }

    function playNeuralSpeech() {
      const text = document.getElementById('outputConsole').textContent;
      if (!text) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      ut.lang = 'hi-IN';
      window.speechSynthesis.speak(ut);
    }

    function copyOutput() {
      navigator.clipboard.writeText(document.getElementById('outputConsole').textContent);
      alert('क्लिपबोर्ड में कॉपी किया गया!');
    }
  </script>
</body>
</html>
