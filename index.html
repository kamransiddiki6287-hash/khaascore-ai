<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KhaasCore AI - Where should we start?</title>
  
  <meta name="description" content="KhaasCore AI is an ultra-advanced intelligence platform mirroring premium minimalist AI interfaces. Owned by Kamran Siddiki.">

  <!-- Elite Ecosystem CDNs: Google Fonts, Material Icons, Markdown, Highlight.js -->
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hl-theme-light">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hl-theme-dark" disabled>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    /* ==========================================================================
       KHAASCORE AI - EXACT VISUAL CLONE & KEYLESS ENGINE
       Owner: Kamran Siddiki (Muzaffarpur, Bihar)
       ========================================================================== */
    
    :root {
      --bg-top: #ffffff;
      --bg-bottom: #dbeafe; 
      --bg-surface: #ffffff;
      --bg-surface-hover: #f0f4f9;
      --text-primary: #1f1f1f;
      --text-secondary: #444746;
      --brand-accent: #1a73e8;
      --user-msg-bg: #f0f4f9;
      --border-color: #e0e0e0;
      --sidebar-width: 300px;
      --pill-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --icon-blue-bg: #c2e7ff;
      --icon-blue-text: #001d35;
    }

    [data-theme="dark"] {
      --bg-top: #131314;
      --bg-bottom: #1e293b;
      --bg-surface: #1e1f20;
      --bg-surface-hover: #333639;
      --text-primary: #e3e3e3;
      --text-secondary: #c4c7c5;
      --brand-accent: #a8c7fa;
      --user-msg-bg: #333639;
      --border-color: #444746;
      --pill-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      --icon-blue-bg: #004a77;
      --icon-blue-text: #c2e7ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: linear-gradient(180deg, var(--bg-top) 40%, var(--bg-bottom) 100%);
      color: var(--text-primary);
      width: 100vw; height: 100vh; overflow: hidden; overscroll-behavior: none; touch-action: none;
      transition: background 0.4s, color 0.4s;
    }

    #elasticWrapper {
      width: 100vw; height: 100vh; display: flex; position: relative; z-index: 10;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; font-size: 24px; color: var(--text-primary); cursor: pointer; user-select: none; transition: background-color 0.2s; }

    /* ==========================================================================
       TOP HEADER
       ========================================================================== */
    .top-header {
      position: absolute; top: 0; left: 0; right: 0; padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between; z-index: 40;
    }
    .header-icon-btn { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .header-icon-btn:hover { background-color: rgba(0,0,0,0.04); }
    [data-theme="dark"] .header-icon-btn:hover { background-color: rgba(255,255,255,0.08); }

    .model-selector {
      display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 500;
      cursor: pointer; padding: 8px 12px; border-radius: 12px;
    }
    .model-selector:hover { background-color: rgba(0,0,0,0.04); }
    [data-theme="dark"] .model-selector:hover { background-color: rgba(255,255,255,0.08); }
    .model-selector .material-symbols-outlined { font-size: 20px; color: var(--text-secondary); }

    /* ==========================================================================
       SIDEBAR
       ========================================================================== */
    .sidebar {
      position: absolute; top: 0; left: calc(-1 * var(--sidebar-width)); width: var(--sidebar-width); height: 100%;
      background-color: var(--bg-surface); display: flex; flex-direction: column; padding: 16px;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    .sidebar.open { left: 0; }
    .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; display: none; opacity: 0; transition: opacity 0.3s; }
    .sidebar-overlay.active { display: block; opacity: 1; }

    .sidebar-header { display: flex; align-items: center; margin-bottom: 30px; }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .history-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 50px; cursor: pointer; font-size: 14px; transition: background-color 0.2s; }
    .history-item:hover { background-color: var(--bg-surface-hover); }
    .history-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

    /* ==========================================================================
       MAIN CONTENT (Hero & Chat)
       ========================================================================== */
    .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; width: 100vw; }

    .hero-welcome {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; padding: 0 20px; animation: fadeIn 0.5s ease; width: 100%;
    }
    .hero-star-svg { width: 56px; height: 56px; margin-bottom: 16px; animation: gentlePulse 4s infinite alternate ease-in-out; }
    @keyframes gentlePulse { from { transform: scale(1); } to { transform: scale(1.05); } }

    .hero-title { font-size: 32px; font-weight: 400; color: var(--text-primary); text-align: center; line-height: 1.2; letter-spacing: -0.5px; }

    .chat-container { display: none; flex: 1; overflow-y: auto; padding: 80px 0 160px 0; flex-direction: column; touch-action: pan-y; }
    .chat-container::-webkit-scrollbar { width: 6px; }
    .chat-container::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 10px; }

    .message-wrapper { width: 100%; padding: 12px 20px; display: flex; justify-content: center; }
    .message-inner { max-width: 800px; width: 100%; display: flex; gap: 16px; }
    
    .user-message .message-inner { justify-content: flex-end; flex-direction: column; align-items: flex-end;}
    .user-bubble { background-color: var(--user-msg-bg); padding: 12px 18px; border-radius: 24px; font-size: 16px; line-height: 1.5; max-width: 85%; display: flex; flex-direction: column; gap: 8px;}
    .user-msg-img { max-width: 250px; border-radius: 12px; }

    .ai-message .message-inner { justify-content: flex-start; }
    .ai-avatar { width: 28px; height: 28px; flex-shrink: 0; animation: rotateStar 4s linear infinite; }
    @keyframes rotateStar { 100% { transform: rotate(360deg); } }
    .ai-bubble { font-size: 16px; line-height: 1.6; width: 100%; overflow-x: auto; padding-top: 2px;}

    .msg-actions { display: flex; gap: 8px; margin-top: 12px; }
    .msg-actions .material-symbols-outlined { font-size: 20px; color: var(--text-secondary); padding: 6px; border-radius: 50%; transition: background 0.2s; }
    .msg-actions .material-symbols-outlined:hover { background-color: var(--bg-surface-hover); }
    .msg-actions .playing { color: var(--brand-accent); }

    pre { background-color: var(--bg-surface-hover); border-radius: 12px; padding: 16px; overflow-x: auto; margin: 12px 0; position: relative; border: 1px solid var(--border-color); }
    code { font-family: 'Courier New', Courier, monospace; font-size: 14px; }

    /* ==========================================================================
       BOTTOM INPUT DOCK (Exact Pill Match)
       ========================================================================== */
    .input-wrapper { position: absolute; bottom: 0; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; padding: 0 20px 24px 20px; z-index: 50; }
    
    .preview-container { display: none; width: 100%; max-width: 800px; padding: 0 16px 8px 16px; }
    .image-badge { position: relative; display: inline-block; }
    .image-badge img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; border: 1px solid var(--border-color); }
    .image-badge .cancel-img { position: absolute; top: -6px; right: -6px; background: var(--bg-surface); border-radius: 50%; font-size: 16px; cursor: pointer; box-shadow: var(--pill-shadow); padding: 2px; }

    .input-pill { width: 100%; max-width: 800px; background-color: var(--bg-surface); border-radius: 40px; padding: 6px 6px 6px 12px; display: flex; align-items: flex-end; gap: 8px; box-shadow: var(--pill-shadow); }
    .input-pill textarea { flex: 1; border: none; background: transparent; outline: none; font-size: 16px; color: var(--text-primary); resize: none; min-height: 44px; max-height: 150px; padding: 12px 4px; line-height: 1.4; }
    .input-pill textarea::placeholder { color: var(--text-secondary); font-weight: 400; }

    .action-icons { display: flex; align-items: center; gap: 2px; padding-bottom: 2px; }
    .icon-btn-plain { padding: 10px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-primary); }
    .icon-btn-plain:hover { background-color: var(--bg-surface-hover); }
    
    .action-btn-blue { width: 44px; height: 44px; border-radius: 50%; background-color: var(--icon-blue-bg); color: var(--icon-blue-text); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; }
    .action-btn-blue:hover { transform: scale(1.05); }
    .action-btn-blue .material-symbols-outlined { color: var(--icon-blue-text); font-variation-settings: 'FILL' 1; }

    .mic-recording { background-color: #fce8e6 !important; color: #d93025 !important; animation: pulseMic 1s infinite alternate; }
    .mic-recording .material-symbols-outlined { color: #d93025 !important; }
    @keyframes pulseMic { from { transform: scale(1); } to { transform: scale(1.1); } }

    .typing-cursor::after { content: '●'; animation: blink 1s step-end infinite; color: var(--brand-accent); margin-left: 2px; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  </style>
</head>
<body>

  <div id="elasticWrapper">
    <!-- SIDEBAR -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="header-icon-btn" onclick="toggleSidebar()"><span class="material-symbols-outlined">menu</span></div>
        <span style="font-size: 18px; font-weight: 500; margin-left: 10px;">KhaasCore AI</span>
      </div>
      <div class="recent-title">Recent</div>
      <div class="history-list" id="historyList"></div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main-content" id="mainContent">
      <header class="top-header">
        <div class="header-icon-btn" onclick="toggleSidebar()"><span class="material-symbols-outlined">menu</span></div>
        <div class="model-selector">
          KhaasCore Flash <span class="material-symbols-outlined">keyboard_arrow_down</span>
        </div>
        <div class="header-icon-btn" onclick="startNewSession()"><span class="material-symbols-outlined">edit_square</span></div>
      </header>

      <!-- Exact Hero Welcome Screen -->
      <div class="hero-welcome" id="heroWelcome">
        <svg class="hero-star-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 0C12 6.62742 17.3726 12 24 12C17.3726 12 12 17.3726 12 24C12 17.3726 6.62742 12 0 12C6.62742 12 12 6.62742 12 0Z" fill="url(#star-grad)"/>
          <defs>
            <linearGradient id="star-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ea4335"/><stop offset="33%" stop-color="#4285f4"/><stop offset="66%" stop-color="#34a853"/><stop offset="100%" stop-color="#fbbc04"/>
            </linearGradient>
          </defs>
        </svg>
        <h1 class="hero-title">Where should we<br>start?</h1>
      </div>

      <div class="chat-container" id="chatContainer"></div>

      <!-- Exact Pill Input Dock -->
      <div class="input-wrapper">
        <div class="preview-container" id="previewContainer">
          <div class="image-badge">
            <img id="previewImage" src="" alt="preview">
            <span class="material-symbols-outlined cancel-img" onclick="removeImage()">close</span>
          </div>
        </div>

        <div class="input-pill">
          <div class="action-icons">
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            <div class="icon-btn-plain" onclick="document.getElementById('imageInput').click()"><span class="material-symbols-outlined">add</span></div>
          </div>
          
          <textarea id="promptArea" rows="1" placeholder="Ask KhaasCore..." oninput="autoResize(this)" onkeydown="onPromptKeydown(event)"></textarea>
          
          <div class="action-icons">
            <div class="icon-btn-plain" id="micBtn" onclick="toggleSpeechRecognition()"><span class="material-symbols-outlined">mic</span></div>
            <div class="action-btn-blue" id="mainActionBtn" onclick="handlePromptSubmission()">
              <span class="material-symbols-outlined" id="mainActionIcon">graphic_eq</span>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script>
    // ==========================================================================
    // ELASTIC RUBBER BOUNCE ENGINE
    // ==========================================================================
    const elasticWrapper = document.getElementById('elasticWrapper');
    let startY = 0; let currentTranslateY = 0; let isDragging = false;

    const handleDragStart = (e) => {
      if (e.target.closest('.chat-container') && document.getElementById('chatContainer').scrollTop > 0) return;
      if (e.target.tagName.toLowerCase() === 'textarea' || e.target.closest('.sidebar')) return;
      isDragging = true;
      startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      elasticWrapper.style.transition = 'none'; 
    };

    const handleDragMove = (e) => {
      if (!isDragging) return;
      const y = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      const deltaY = y - startY;
      currentTranslateY = deltaY * 0.30; 
      elasticWrapper.style.transform = `translateY(${currentTranslateY}px)`;
    };

    const handleDragEnd = () => {
      if (!isDragging) return;
      isDragging = false;
      elasticWrapper.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
      elasticWrapper.style.transform = `translateY(0px)`;
      currentTranslateY = 0;
    };

    elasticWrapper.addEventListener('mousedown', handleDragStart);
    window.addEventListener('mousemove', handleDragMove);
    window.addEventListener('mouseup', handleDragEnd);
    elasticWrapper.addEventListener('touchstart', handleDragStart, {passive: false});
    window.addEventListener('touchmove', handleDragMove, {passive: false});
    window.addEventListener('touchend', handleDragEnd);

    // ==========================================================================
    // UI INTERACTIONS & THEME
    // ==========================================================================
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const promptArea = document.getElementById('promptArea');
    const mainActionIcon = document.getElementById('mainActionIcon');
    const chatContainer = document.getElementById('chatContainer');
    const heroWelcome = document.getElementById('heroWelcome');
    
    let currentImageBase64 = null;
    let currentImageMime = null;
    
    function toggleSidebar() {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('active');
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
      if (promptArea.value.trim().length > 0 || currentImageBase64) {
        mainActionIcon.innerText = 'send';
      } else {
        mainActionIcon.innerText = 'graphic_eq';
      }
    }

    function onPromptKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handlePromptSubmission(); }
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      currentImageMime = file.type;
      const reader = new FileReader();
      reader.onload = function(e) {
        currentImageBase64 = e.target.result.split(',')[1];
        document.getElementById('previewImage').src = e.target.result;
        document.getElementById('previewContainer').style.display = 'block';
        autoResize(promptArea);
      };
      reader.readAsDataURL(file);
      event.target.value = ''; 
    }

    function removeImage() {
      currentImageBase64 = null; currentImageMime = null;
      document.getElementById('previewContainer').style.display = 'none';
      autoResize(promptArea);
    }

    // --- SPEECH TO TEXT & TTS ---
    let isRecognizing = false;
    let recognition = null;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'hi-IN';
      recognition.onstart = () => { isRecognizing = true; document.getElementById('micBtn').classList.add('mic-recording'); };
      recognition.onresult = (event) => {
        promptArea.value = (promptArea.value ? promptArea.value + ' ' : '') + event.results[0][0].transcript;
        autoResize(promptArea);
      };
      recognition.onend = () => { isRecognizing = false; document.getElementById('micBtn').classList.remove('mic-recording'); };
      recognition.onerror = () => { isRecognizing = false; document.getElementById('micBtn').classList.remove('mic-recording'); };
    }

    function toggleSpeechRecognition() {
      if (!recognition) return alert("आपका ब्राउज़र वॉइस इनपुट सपोर्ट नहीं करता।");
      if (isRecognizing) recognition.stop(); else recognition.start();
    }

    function playTTS(btn, text) {
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        document.querySelectorAll('.msg-actions .material-symbols-outlined').forEach(b => b.classList.remove('playing'));
        return;
      }
      const utterance = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      const naturalVoice = voices.find(v => v.lang.includes('hi') || v.lang.includes('IN')) || voices[0];
      if (naturalVoice) utterance.voice = naturalVoice;
      utterance.rate = 0.95;
      btn.classList.add('playing');
      utterance.onend = () => btn.classList.remove('playing');
      utterance.onerror = () => btn.classList.remove('playing');
      window.speechSynthesis.speak(utterance);
    }

    function copyText(btn, text) {
      navigator.clipboard.writeText(text);
      btn.innerText = 'check';
      setTimeout(() => btn.innerText = 'content_copy', 2000);
    }

    // ==========================================================================
    // KEYLESS HYBRID ENGINE (No API Key Required)
    // Works via robust local matching + Wikipedia API for live knowledge
    // ==========================================================================

    async function generateKeylessResponse(query) {
      const q = query.toLowerCase();

      // 1. Personal & Creator Identity (Hidden until asked)
      if (q.includes("who made you") || q.includes("who created you") || q.includes("किसने बनाया") || q.includes("तुम्हारा मालिक")) {
        return "मुझे **Kamran Siddiki** ने बनाया है। उनका ताल्लुक **मुज़फ़्फ़रपुर, बिहार** से है और वे 'Gyan Bhai Siddiqui' नाम का एक शानदार YouTube चैनल चलाते हैं।";
      }

      // 2. Specific Tasks (Shayari)
      if (q.includes("shayari") || q.includes("शायरी")) {
        return "यहाँ आपके 'Gyan Bhai Siddiqui' चैनल के लिए एक बेहतरीन कामयाबी की शायरी है:\n\n> **हौसलों के तरकश में कोशिश का वो तीर ज़िंदा रख,**\n> **हार जा चाहे ज़िंदगी में सब कुछ,**\n> **मगर फिर से जीतने की वो उम्मीद ज़िंदा रख!**\n\nइसे अपने अगले YouTube Shorts में ज़रूर इस्तेमाल करें!";
      }

      // 3. Comedy Script
      if (q.includes("script") || q.includes("comedy") || q.includes("brother") || q.includes("भाई")) {
        return "यहाँ बड़ा भाई और छोटे भाई की एक मज़ेदार शॉर्ट स्क्रिप्ट है:\n\n**बड़ा भाई:** (गुस्से में) अरे ओ छोटे! दिन भर फोन में क्या देखता रहता है?\n**छोटा भाई:** ज्ञान भाई सिद्दीकी की वीडियो देख रहा हूँ, कामयाबी का रास्ता ढूँढ रहा हूँ!\n**बड़ा भाई:** रास्ता तो ठीक है, पर पहले जाकर मेरे लिए एक कप चाय तो बना ला!\n*(छोटा भाई मुँह बनाता है और हँसते हुए चला जाता है)*";
      }

      // 4. Industrial Detergent
      if (q.includes("detergent") || q.includes("cost") || q.includes("fena") || q.includes("डिटर्जेंट")) {
        return "### Supreme Platinum Detergent Cost Sheet (Fena Quality)\n\n* **Acid Slurry (LABSA):** 12%\n* **Soda Ash:** 25%\n* **Sodium Silicate:** 10%\n* **STPP (Water Softener):** 5%\n* **Salt (Filler):** 40%\n* **Perfume & Colors:** 3%\n* **Packaging:** 5%\n\n**अनुमानित लागत:** ₹35 - ₹40 प्रति किलोग्राम (मुज़फ़्फ़रपुर के कच्चे माल की कीमतों के अनुसार)।";
      }

      // 5. Video Generation Request
      if (q.includes("video") || q.includes("वीडियो") || q.includes("shorts")) {
        return "वीडियो बनाने के लिए मेरी **KhaasCore 3D Cinematic API** बैकग्राउंड में तैयार है। कृपया मुझे टॉपिक बताएं, मैं तुरंत स्क्रिप्ट और रेंडर कमांड तैयार कर दूंगा।";
      }

      // 6. Live Information Fetch (Free Wikipedia API)
      try {
        const searchUrl = `https://hi.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`;
        const res = await fetch(searchUrl);
        const data = await res.json();
        
        if (data.query.search.length > 0) {
          const pageId = data.query.search[0].pageid;
          const detailUrl = `https://hi.wikipedia.org/w/api.php?action=query&prop=extracts&exintro&explaintext&pageids=${pageId}&format=json&origin=*`;
          const detailRes = await fetch(detailUrl);
          const detailData = await detailRes.json();
          let extract = detailData.query.pages[pageId].extract;
          
          if (extract.length > 500) extract = extract.substring(0, 500) + "...";
          return extract;
        }
      } catch (e) {
        console.log("Live fetch error", e);
      }

      // 7. General Fallback
      return "मैं KhaasCore AI हूँ। आप मुझसे अपने YouTube चैनल के लिए स्क्रिप्ट, शायरी, या कोई भी सामान्य सवाल पूछ सकते हैं। मैं मदद के लिए हमेशा तैयार हूँ!";
    }

    async function handlePromptSubmission() {
      const userText = promptArea.value.trim();
      if (!userText && !currentImageBase64) return;

      heroWelcome.style.display = 'none';
      chatContainer.style.display = 'flex';

      const imgB64 = currentImageBase64;
      const imgMime = currentImageMime;

      renderUserMessage(userText, imgB64, imgMime);
      
      promptArea.value = '';
      removeImage(); 
      autoResize(promptArea);

      const aiBubble = renderAILoadingMessage();
      
      // Artificial Delay to simulate thinking
      setTimeout(async () => {
        aiBubble.innerHTML = ''; 
        aiBubble.classList.add('typing-cursor');

        // Fetch Keyless Response
        const responseText = await generateKeylessResponse(userText);
        
        aiBubble.innerHTML = marked.parse(responseText);
        aiBubble.classList.remove('typing-cursor');
        
        addActionsToAIMessage(aiBubble.parentElement, responseText);
        
        aiBubble.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightElement(block);
        });

        scrollChat();
      }, 1200);
    }

    function renderUserMessage(text, imgB64, imgMime) {
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper user-message';
      let imgHTML = imgB64 ? `<img src="data:${imgMime};base64,${imgB64}" class="user-msg-img">` : '';
      wrapper.innerHTML = `<div class="message-inner"><div class="user-bubble">${imgHTML}${text ? `<div>${text}</div>` : ''}</div></div>`;
      chatContainer.appendChild(wrapper);
      scrollChat();
    }

    function renderAILoadingMessage() {
      const starSVG = `<svg class="ai-avatar" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C12 6.62742 17.3726 12 24 12C17.3726 12 12 17.3726 12 24C12 17.3726 6.62742 12 0 12C6.62742 12 12 6.62742 12 0Z" fill="url(#star-grad-small)"/><defs><linearGradient id="star-grad-small" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#ea4335"/><stop offset="33%" stop-color="#4285f4"/><stop offset="66%" stop-color="#34a853"/><stop offset="100%" stop-color="#fbbc04"/></linearGradient></defs></svg>`;
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper ai-message';
      wrapper.innerHTML = `<div class="message-inner">${starSVG}<div style="flex:1;"><div class="ai-bubble typing-cursor"></div></div></div>`;
      chatContainer.appendChild(wrapper);
      scrollChat();
      return wrapper.querySelector('.ai-bubble');
    }

    function addActionsToAIMessage(container, fullText) {
      const actionDiv = document.createElement('div');
      actionDiv.className = 'msg-actions';
      actionDiv.innerHTML = `
        <span class="material-symbols-outlined" title="Copy" onclick="copyText(this, \`${fullText.replace(/`/g, "\\`").replace(/"/g, '&quot;')}\`)">content_copy</span>
        <span class="material-symbols-outlined" title="Listen" onclick="playTTS(this, \`${fullText.replace(/`/g, "\\`").replace(/"/g, '&quot;')}\`)">volume_up</span>
      `;
      container.appendChild(actionDiv);
    }

    function scrollChat() { chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' }); }

    function startNewSession() {
      chatContainer.innerHTML = '';
      chatContainer.style.display = 'none';
      heroWelcome.style.display = 'flex';
      if (sidebar.classList.contains('open')) toggleSidebar();
    }
  </script>
</body>
</html>
