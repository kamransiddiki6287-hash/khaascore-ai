<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Language Advanced Web Experience</title>
    <meta name="color-scheme" content="dark light">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b);
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-glow: rgba(255, 255, 255, 0.1);
            --accent-neon: #818cf8;
            --text-main: #f8fafc;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Navigation & Language Dock */
        nav {
            position: fixed;
            top: 20px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            padding: 10px 25px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        nav a { color: white; text-decoration: none; font-weight: 500; transition: 0.3s; }
        nav a:hover { color: var(--accent-neon); }

        /* Advanced Language Selector Dropdown */
        .lang-select {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 1px solid var(--accent-neon);
            padding: 5px 10px;
            border-radius: 15px;
            cursor: pointer;
            outline: none;
        }

        main { text-align: center; max-width: 800px; padding: 40px; margin-top: 100px; }

        h1 {
            font-size: 3rem;
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" id="nav-home">Home</a>
        <a href="#" id="nav-features">Features</a>
        <!-- Language Switcher Dropdown -->
        <select class="lang-select" onchange="changeLanguage(this.value)">
            <option value="en">🌐 English</option>
            <option value="hi">🌐 हिंदी (Hindi)</option>
            <option value="es">🌐 Español (Spanish)</option>
        </select>
    </nav>

    <main>
        <!-- Data attributes are used for smooth switching -->
        <h1 id="main-heading">Duniya ki Sabse Advance Tech Website</h1>
        <p id="main-desc">Yeh page pure HTML5 aur CSS3 ke advanced parameters par bana hai.</p>
        <button id="main-btn">Launch AI Terminal</button>
    </main>

    <script>
        // Language Dictionary Data
        const translations = {
            en: {
                home: "Home",
                features: "Features",
                heading: "The World's Most Advanced Website",
                desc: "This page is built using high-performance HTML5, CSS3, and Smart AI architecture.",
                btn: "Launch AI Terminal"
            },
            hi: {
                home: "होम",
                features: "विशेषताएं",
                heading: "दुनिया की सबसे एडवांस वेबसाइट",
                desc: "यह पेज हाई-परफॉर्मेंस HTML5, CSS3 और स्मार्ट AI आर्किटेक्चर का उपयोग करके बनाया गया है।",
                btn: "एआई टर्मिनल शुरू करें"
            },
            es: {
                home: "Inicio",
                features: "Características",
                heading: "El sitio web más avanzado del mundo",
                desc: "Esta página está creada con una arquitectura inteligente HTML5, CSS3 y IA de alto rendimiento.",
                btn: "Iniciar terminal de IA"
            }
        };

        // Function to change language instantly without reload
        function changeLanguage(lang) {
            document.getElementById('nav-home').innerText = translations[lang].home;
            document.getElementById('nav-features').innerText = translations[lang].features;
            document.getElementById('main-heading').innerText = translations[lang].heading;
            document.getElementById('main-desc').innerText = translations[lang].desc;
            document.getElementById('main-btn').innerText = translations[lang].btn;
            
            // Updates the document language attribute for SEO and screen readers
            document.documentElement.lang = lang;
        }

        // Set default language on load
        changeLanguage('en');
    </script>
</body>
</html>
