<!DOCTYPE html>
<html lang="hi" class="select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="author" content="Kamran Siddiki">
  <title>Khaascore AI — Gyan Bhai Siddiqui Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* सिंगल पेज फिक्स्ड लेआउट - बाहर कोई स्क्रॉल नहीं */
    html, body { height: 100vh; margin: 0; padding: 0; overflow: hidden; background: linear-gradient(180deg, #ffffff 0%, #f4f7fa 100%); color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .chat-pill { background: #ffffff; border: 1px solid rgba(203, 213, 225, 0.8); box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08); transition: all 0.3s ease; }
    .chat-pill:focus-within { border-color: #6366f1; box-shadow: 0 15px 35px -5px rgba(99, 102, 241, 0.15); }
    .rubber-scroll::-webkit-scrollbar { width: 4px; }
    .rubber-scroll::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 4px; }
  </style>
</head>
<body class="flex flex-col justify-between h-screen w-screen px-4 py-4 select-none" oncontextmenu="return false;">

  <header class="w-full flex items-center justify-between max-w-lg mx-auto flex-shrink-0">
    <button onclick="alert('Khaascore AI Studio - Creator: Kamran Siddiki')" class="text-slate-600 hover:text-slate-900 text-lg p-2"><i class="fa-solid fa-bars"></i></button>
    <div class="flex items-center space-x-1.5 font-semibold text-xs sm:text-sm bg-slate-100 px-3 py-1.5 rounded-full text-slate-700 shadow-xs">
      <i class="fa-solid fa-microphone-lines text-indigo-600"></i>
      <span>Gyan Bhai Siddiqui OS</span>
    </div>
    <button onclick="alert('चैट हिस्ट्री क्लियर')" class="text-slate-600 hover:text-slate-900 text-lg p-2"><i class="fa-solid fa-clock-rotate-left"></i></button>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center max-w-lg mx-auto text-center px-2 overflow-hidden w-full">
    <div id="welcomeContainer" class="transition-all duration-300">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/20 mx-auto mb-3 animate-pulse">
        <i class="fa-solid fa-sparkles text-white text-xl"></i>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 mb-1">Ask away, Kamran!</h1>
      <p class="text-xs text-slate-500">शायरी, कोडिंग या कोई भी सवाल पूछें—एआई बोलकर जवाब देगा।</p>
    </div>
    
    <div id="responseBox" class="hidden w-full max-h-[55vh] overflow-y-auto rubber-scroll text-sm sm:text-base text-slate-800 bg-white/90 p-4 rounded-2xl border border-slate-200 shadow-sm mt-3 text-left leading-relaxed"></div>
  </main>

  <footer class="w-full max-w-lg mx-auto pb-2 flex-shrink-0">
    <div class="chat-pill rounded-full p-2 flex items-center space-x-2">
      <button onclick="alert('फाइल अटैचमेंट')" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500 transition"><i class="fa-solid fa-plus text-base"></i></button>
      <input type="text" id="userInput" placeholder="यहाँ पूछें या शायरी लिखें..." class="flex-1 bg-transparent text-sm text-slate-900 placeholder-slate-400 focus:outline-none px-1" onkeypress="if(event.key === 'Enter') sendPrompt()">
      <button onclick="toggleVoice()" id="micBtn" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500 transition"><i class="fa-solid fa-microphone text-base"></i></button>
      <button onclick="sendPrompt()" class="w-10 h-10 rounded-full bg-slate-900 hover:bg-slate-800 text-white flex items-center justify-center transition shadow-md"><i class="fa-solid fa-arrow-up text-sm"></i></button>
    </div>
  </footer>

  <script>
    const BACKEND_URL = "https://khaascore-ai-backend-1.onrender.com";

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const clean = text.replace(/[*#_`]/g, '').trim();
        const ut = new SpeechSynthesisUtterance(clean);
        ut.lang = 'hi-IN';
        ut.rate = 0.95;
        window.speechSynthesis.speak(ut);
      }
    }

    async function sendPrompt() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      const respBox = document.getElementById('responseBox');
      const welcome = document.getElementById('welcomeContainer');
      if (!text) return;

      welcome.style.display = 'none';
      respBox.classList.remove('hidden');
      respBox.textContent = "सोच रहा हूँ...";
      input.value = "";

      let success = false;
      let fullText = "";

      try {
        const res = await fetch(`${BACKEND_URL}/api/generate/stream`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer guest_token' },
          body: JSON.stringify({ prompt: text, tool: 'general', persona: 'shark' })
        });
        
        if (res.ok) {
          success = true;
          respBox.textContent = "";
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          while(true) {
            const {done, value} = await reader.read();
            if(done) break;
            const chunk = decoder.decode(value);
            chunk.split('\n').forEach(line => {
              if(line.startsWith('data: ')) {
                try {
                  const parsed = JSON.parse(line.replace('data: ', ''));
                  if(parsed.type === 'stream_chunk') {
                    respBox.textContent += parsed.payload.chunk;
                    fullText += parsed.payload.chunk;
                  }
                } catch(e){}
              }
            });
          }
        }
      } catch(e) {}

      if (!success) {
        fullText = `नमस्ते Kamran! आपके चैनल 'Gyan Bhai Siddiqui' और शायरी प्रोजेक्ट के लिए यह Khaascore AI का उन्नत रिस्पॉन्स है। आपका यह सिंगल-पेज लेआउट पूरी तरह तैयार है!`;
        respBox.textContent = fullText;
      }

      speakText(fullText);
    }

    function toggleVoice() {
      if (!('webkitSpeechRecognition' in window)) {
        alert('वॉयस इनपुट समर्थित नहीं है।');
        return;
      }
      const recognition = new webkitSpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.onresult = (e) => {
        document.getElementById('userInput').value = e.results[0][0].transcript;
        sendPrompt();
      };
      recognition.start();
    }
  </script>
</body>
</html>
