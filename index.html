<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Ultra AI - Multi-Modal Intelligent System</title>
  
  <!-- Markdown & Code Highlighting CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #090d16;
      --sidebar: #0f172a;
      --card: #131d33;
      --chat-user: #1e3a8a;
      --chat-ai: #17233f;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      transition: all 0.3s ease;
    }
    .brand {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .btn {
      background: var(--border);
      color: var(--text);
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }
    .btn:hover { background: #334155; }
    .btn-primary { background: var(--accent); color: #090d16; font-weight: 600; border: none; }
    .btn-primary:hover { opacity: 0.9; }

    /* Main Container */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    /* Top Bar */
    .topbar {
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--sidebar);
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    select, input[type="password"] {
      background: #060911;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
    }

    /* Chat Area */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .message {
      max-width: 82%;
      padding: 16px 20px;
      border-radius: 12px;
      line-height: 1.65;
      font-size: 15px;
      word-break: break-word;
      position: relative;
    }
    .message.user {
      align-self: flex-end;
      background: var(--chat-user);
      border-bottom-right-radius: 2px;
    }
    .message.ai {
      align-self: flex-start;
      background: var(--chat-ai);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
      width: 100%;
      max-width: 88%;
    }
    .message img.preview {
      max-width: 250px;
      max-height: 200px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: block;
      border: 1px solid var(--border);
    }

    /* Action bar inside AI responses */
    .msg-actions {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 12px;
      color: var(--text-muted);
    }
    .msg-actions span {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .msg-actions span:hover { color: var(--accent); }

    /* Markdown Styling */
    .message.ai pre {
      background: #060911;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin: 12px 0;
      overflow-x: auto;
      position: relative;
    }
    .message.ai code { font-family: monospace; font-size: 14px; }
    .message.ai table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
    }
    .message.ai th, .message.ai td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }
    .message.ai th { background: #0b1329; }

    /* Input Footer */
    .footer {
      padding: 16px 20px;
      background: var(--sidebar);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #060911;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
    }
    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      height: 48px;
      outline: none;
      padding: 8px 0;
    }
    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: 0.2s;
    }
    .icon-btn:hover { color: var(--accent); background: rgba(56, 189, 248, 0.1); }
    .icon-btn.active { color: #ef4444; }

    #filePreviewContainer {
      display: none;
      align-items: center;
      gap: 10px;
      background: #111a2e;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      width: fit-content;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="brand"><i data-lucide="sparkles"></i> Nexus Ultra AI</div>
    <button class="btn btn-primary" onclick="startNewChat()"><i data-lucide="plus"></i> New Chat</button>
    <button class="btn" onclick="exportChat()"><i data-lucide="download"></i> Export Chat</button>
    <button class="btn" onclick="clearAllData()"><i data-lucide="trash-2"></i> Clear History</button>
  </div>

  <!-- Main Chat -->
  <div class="main">
    <div class="topbar">
      <div style="display: flex; align-items: center; gap: 12px;">
        <input type="password" id="apiKey" placeholder="Gemini API Key (AIzaSy...)" style="width: 240px;" />
        <button class="btn" onclick="saveApiKey()" style="padding: 6px 12px; font-size: 12px;">Save Key</button>
      </div>

      <div class="controls">
        <label style="font-size: 12px; color: var(--text-muted);">Mode:</label>
        <select id="modeSelect">
          <option value="adaptive">🎯 Adaptive (सटीक व विस्तृत)</option>
          <option value="deep">📚 10,000-Word Exhaustive (गहरा विश्लेषण)</option>
          <option value="concise">⚡ Concise (संक्षिप्त व बिंदुवार)</option>
          <option value="code">💻 Software Architect (कोडिंग मोड)</option>
        </select>
      </div>
    </div>

    <div class="chat-container" id="chatBox">
      <div class="message ai">
        नमस्ते! मैं आपका संपूर्ण मल्टीमॉडल AI साथी हूँ। आप मुझे तस्वीरें दिखा सकते हैं, वॉइस से बात कर सकते हैं, या जितना विस्तृत चाहें उतना लंबा व सटीक विश्लेषण प्राप्त कर सकते हैं।
      </div>
    </div>

    <!-- Footer Input -->
    <div class="footer">
      <div id="filePreviewContainer">
        <span id="fileName">file.png</span>
        <i data-lucide="x" style="cursor:pointer; width:14px;" onclick="removeFile()"></i>
      </div>

      <div class="input-wrapper">
        <input type="file" id="fileInput" accept="image/*,application/pdf" style="display: none;" onchange="handleFileUpload(event)">
        <button class="icon-btn" title="Upload Image / Document" onclick="document.getElementById('fileInput').click()">
          <i data-lucide="paperclip"></i>
        </button>

        <textarea id="userInput" placeholder="अपना सवाल पूछें या निर्देश दें..." onkeydown="handleKeyDown(event)"></textarea>

        <button class="icon-btn" id="micBtn" title="Speak" onclick="toggleSpeechRecognition()">
          <i data-lucide="mic"></i>
        </button>

        <button class="btn btn-primary" id="sendBtn" onclick="submitMessage()" style="padding: 8px 16px;">
          <i data-lucide="send"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    let chatHistory = [];
    let currentUploadedBase64 = null;
    let currentMimeType = null;
    let recognition = null;
    let isListening = false;

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('apiKey').value = savedKey;

      const savedHistory = localStorage.getItem('gemini_chat_history');
      if (savedHistory) {
        chatHistory = JSON.parse(savedHistory);
        renderHistory();
      }
    };

    function saveApiKey() {
      const key = document.getElementById('apiKey').value.trim();
      if (!key) return alert('कृपया मान्य API Key डालें!');
      localStorage.setItem('gemini_api_key', key);
      alert('API Key सफलतापूर्वक सुरक्षित की गई!');
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitMessage();
      }
    }

    // Speech-to-Text
    function toggleSpeechRecognition() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        return alert('आपके ब्राउज़र में वॉइस इनपुट सपोर्ट उपलब्ध नहीं है।');
      }

      if (isListening) {
        recognition.stop();
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').classList.add('active');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('userInput').value += ' ' + transcript;
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('active');
      };

      recognition.start();
    }

    // Text-to-Speech
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/[#*`_\[\]]/g, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'hi-IN';
        window.speechSynthesis.speak(utterance);
      }
    }

    // File Handling
    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        currentUploadedBase64 = reader.result.split(',')[1];
        currentMimeType = file.type;
        document.getElementById('fileName').innerText = file.name;
        document.getElementById('filePreviewContainer').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function removeFile() {
      currentUploadedBase64 = null;
      currentMimeType = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('filePreviewContainer').style.display = 'none';
    }

    // Dynamic System Prompts
    function getSystemInstruction(mode) {
      switch(mode) {
        case 'deep':
          return `आप एक उच्च-स्तरीय अकादमिक, शोधकर्ता और विषय विशेषज्ञ हैं। उपयोगकर्ता के हर सवाल का उत्तर अत्यंत विस्तृत, संपूर्ण, चरणबद्ध और 5,000 से 10,000 शब्दों जैसे गहन विश्लेषण के साथ दें। हर पहलू, केस स्टडी और डेटा को गहराई से कवर करें।`;
        case 'concise':
          return `आप एक अत्यधिक सटीक और संक्षिप्त सहायक हैं। बिना किसी लंबी भूमिका के उत्तर केवल 2-4 बुलेट पॉइंट्स या आवश्यक पंक्तियों में दें।`;
        case 'code':
          return `आप एक सीनियर सॉफ्टवेयर आर्किटेक्ट हैं। बेस्ट प्रैक्टिसेज, क्लीन कोड आर्किटेक्चर, एरर हैंडलिंग और संपूर्ण कोड स्निपेट्स प्रदान करें।`;
        default:
          return `आप एक अत्यंत बुद्धिमान, दोस्ताना और तार्किक AI साथी हैं। उपयोगकर्ता जितनी लंबाई, गहराई और जिस लहजे में उत्तर मांगे, ठीक उसी निर्देश का कड़ाई से पालन करें। फॉर्मेटिंग के लिए Markdown, Tables और Code Blocks का व्यवस्थित उपयोग करें।`;
      }
    }

    async function submitMessage() {
      const apiKey = document.getElementById('apiKey').value.trim() || localStorage.getItem('gemini_api_key');
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      const mode = document.getElementById('modeSelect').value;

      if (!apiKey) return alert('कृपया पहले अपनी Gemini API Key दर्ज करें!');
      if (!text && !currentUploadedBase64) return;

      // Prepare User Payload
      const userParts = [];
      if (currentUploadedBase64) {
        userParts.push({
          inlineData: { mimeType: currentMimeType, data: currentUploadedBase64 }
        });
      }
      if (text) {
        userParts.push({ text });
      }

      // Render User Message
      renderMessage({ role: 'user', text, image: currentUploadedBase64, mimeType: currentMimeType });
      chatHistory.push({ role: 'user', parts: userParts });

      input.value = '';
      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;

      // Temporary AI Node for Streaming
      const aiNode = createAIMessageContainer();
      const contentSpan = aiNode.querySelector('.content-body');
      let fullResponseText = '';

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:streamGenerateContent?alt=sse&key=${apiKey}`;

      const requestBody = {
        systemInstruction: { parts: [{ text: getSystemInstruction(mode) }] },
        contents: chatHistory,
        generationConfig: {
          maxOutputTokens: 8192,
          temperature: mode === 'code' ? 0.2 : 0.7
        }
      };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || 'Server Error');
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');

        removeFile();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const json = JSON.parse(line.replace('data: ', '').trim());
                const piece = json.candidates?.[0]?.content?.parts?.[0]?.text || '';
                fullResponseText += piece;
                contentSpan.innerHTML = marked.parse(fullResponseText);
                hljs.highlightAll();
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
              } catch (e) {}
            }
          }
        }

        chatHistory.push({ role: 'model', parts: [{ text: fullResponseText }] });
        saveHistoryToStorage();
        attachActionEvents(aiNode, fullResponseText);

      } catch (err) {
        contentSpan.innerHTML = `<span style="color:#ef4444;">त्रुटि: ${err.message}</span>`;
      } finally {
        sendBtn.disabled = false;
      }
    }

    function createAIMessageContainer() {
      const chatBox = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = 'message ai';
      div.innerHTML = `<div class="content-body">...</div>`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function attachActionEvents(aiNode, fullText) {
      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'msg-actions';
      actionsDiv.innerHTML = `
        <span onclick="copyToClipboard(\`${encodeURIComponent(fullText)}\`)"><i data-lucide="copy" style="width:14px;"></i> Copy</span>
        <span onclick="speakText(\`${encodeURIComponent(fullText)}\`)"><i data-lucide="volume-2" style="width:14px;"></i> Listen</span>
      `;
      aiNode.appendChild(actionsDiv);
      lucide.createIcons();
    }

    function copyToClipboard(encodedText) {
      navigator.clipboard.writeText(decodeURIComponent(encodedText));
      alert('टेक्स्ट कॉपी कर लिया गया!');
    }

    function renderMessage(msg) {
      const chatBox = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = `message ${msg.role}`;

      if (msg.image) {
        const img = document.createElement('img');
        img.className = 'preview';
        img.src = `data:${msg.mimeType};base64,${msg.image}`;
        div.appendChild(img);
      }

      if (msg.text) {
        const body = document.createElement('div');
        body.innerHTML = msg.role === 'ai' ? marked.parse(msg.text) : msg.text;
        div.appendChild(body);
      }

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      hljs.highlightAll();
    }

    function saveHistoryToStorage() {
      localStorage.setItem('gemini_chat_history', JSON.stringify(chatHistory));
    }

    function renderHistory() {
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '';
      chatHistory.forEach(item => {
        const text = item.parts.find(p => p.text)?.text || '';
        renderMessage({ role: item.role === 'model' ? 'ai' : 'user', text });
      });
    }

    function startNewChat() {
      if (confirm('क्या आप नई बातचीत शुरू करना चाहते हैं?')) {
        chatHistory = [];
        localStorage.removeItem('gemini_chat_history');
        location.reload();
      }
    }

    function exportChat() {
      const blob = new Blob([JSON.stringify(chatHistory, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `chat-session-${Date.now()}.json`;
      a.click();
    }

    function clearAllData() {
      if (confirm('क्या आप सभी चैट्स और API Key हटाना चाहते हैं?')) {
        localStorage.clear();
        location.reload();
      }
    }
  </script>
</body>
</html>
