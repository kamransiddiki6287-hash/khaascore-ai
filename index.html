<!DOCTYPE html>
<html lang="hi" class="select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: wss:; img-src 'self' https: data:; font-src 'self' https: data:;">
  <meta name="author" content="Kamran Siddiki">
  <title>Khaascore AI — 2099 Ultimate Neural Studio</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* 100% वन-पेज फिक्स्ड लेआउट - बाहर कोई स्क्रॉल नहीं, केवल अंदर रबर स्क्रॉल */
    html, body { height: 100vh; margin: 0; padding: 0; overflow: hidden; background-color: #f8fafc; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
    #neuralCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.12; }
    
    .glass-box {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(79, 70, 229, 0.1);
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
    }

    .action-btn {
      background: #ffffff;
      border: 1px solid rgba(79, 70, 229, 0.15);
      transition: all 0.2s ease;
    }
    .action-btn:hover {
      background: rgba(79, 70, 229, 0.05);
      border-color: rgba(79, 70, 229, 0.4);
    }

    .teleprompter-active { position: fixed; inset: 0; z-index: 9999; background: #ffffff; padding: 4rem 2rem; overflow-y: scroll; scroll-behavior: smooth; font-size: 2.2rem; line-height: 2.4; color: #0f172a; }
    .voice-wave { animation: soundWave 1s infinite ease-in-out alternate; }
    @keyframes soundWave { 0% { height: 4px; } 100% { height: 24px; } }
    ::selection { background: #4f46e5; color: #ffffff; }
  </style>
</head>
<body class="flex flex-col justify-between h-screen w-screen relative" oncontextmenu="return false;">

  <canvas id="neuralCanvas"></canvas>

  <!-- 🌟 शुद्ध वाइट प्रीमियम हेडर -->
  <header class="w-full glass-box border-b border-slate-200 z-40 flex-shrink-0">
    <div class="max-w-4xl mx-auto px-6 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-2xl bg-indigo-600 flex items-center justify-center shadow-md shadow-indigo-500/20">
          <i class="fa-solid fa-brain text-white text-base"></i>
        </div>
        <div>
          <span class="text-base font-black tracking-tight text-slate-900 block">Khaascore <span class="text-indigo-600 font-light">AI</span></span>
          <span class="text-[8px] font-mono text-indigo-600 uppercase tracking-widest block font-bold">Autonomous Neural Studio</span>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="stopHumanVoice()" class="action-btn text-[11px] font-medium text-rose-600 px-3 py-1.5 rounded-xl flex items-center space-x-1">
          <i class="fa-solid fa-volume-xmark"></i>
          <span>आवाज़ रोकें</span>
        </button>
        <button onclick="alert('फाउंडर प्रोटोकॉल: Khaascore AI के एकमात्र आर्किटेक्ट और विजनरी Kamran Siddiki हैं।')" class="action-btn text-xs font-bold text-slate-800 px-3 py-1.5 rounded-xl flex items-center space-x-1">
          <i class="fa-solid fa-fingerprint text-indigo-600"></i>
          <span>फाउंडर</span>
        </button>
      </div>
    </div>
  </header>

  <!-- मुख्य वर्कस्पेस -->
  <main class="w-full max-w-4xl mx-auto px-6 py-4 flex-1 flex flex-col space-y-3 relative z-10 overflow-hidden">

    <!-- आउटपुट स्क्रीन (स्मूथ रबर स्क्रॉलिंग कंसोल) -->
    <section class="glass-box rounded-3xl p-5 flex-1 flex flex-col relative overflow-hidden">
      
      <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-3 text-xs text-slate-500 flex-shrink-0">
        <div class="flex items-center space-x-2">
          <span class="w-2.5 h-2.5 rounded-full bg-indigo-600 animate-ping"></span>
          <span class="font-mono text-xs text-indigo-600 font-bold">मानवीकृत स्वर और लाइव स्ट्रीम सक्रिय</span>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="toggleTeleprompter()" class="action-btn px-2.5 py-1 rounded-xl text-slate-700 text-xs font-medium">
            <i class="fa-solid fa-desktop mr-1 text-indigo-600"></i> टेलीप्रॉम्प्टर
          </button>
          <button onclick="replayVoice()" class="action-btn px-2.5 py-1 rounded-xl text-slate-700 text-xs font-medium">
            <i class="fa-solid fa-volume-high mr-1 text-sky-600"></i> सुनें
          </button>
          <button onclick="copyOutput()" class="action-btn px-2.5 py-1 rounded-xl text-slate-700 text-xs font-medium">
            <i class="fa-solid fa-copy mr-1 text-emerald-600"></i> कॉपी
          </button>
        </div>
      </div>

      <div id="thinkingState" class="hidden my-auto text-center space-y-3 py-16 flex-shrink-0">
        <div class="inline-flex p-4 rounded-3xl bg-indigo-50 border border-indigo-200">
          <i class="fa-solid fa-atom text-3xl text-indigo-600 animate-spin"></i>
        </div>
        <p id="thinkingStep" class="text-xs font-mono text-indigo-600 tracking-wider">[क्वांटम प्रोसेसिंग और स्वर तैयार हो रहा है...]</p>
      </div>

      <!-- आउटपुट कंसोल (यहाँ टेक्स्ट दिखेगा और रबड़ की तरह स्क्रॉल होगा) -->
      <div id="outputConsole" class="flex-1 overflow-y-auto text-base leading-relaxed space-y-3 whitespace-pre-wrap text-slate-900 font-normal pr-2">
        <div class="text-slate-500 text-center py-16 font-light space-y-2">
          <i class="fa-solid fa-bolt text-4xl mb-2 block text-indigo-600 animate-pulse"></i>
          <p class="text-lg font-bold text-slate-900">Khaascore AI न्यूरल कोर ऑनलाइन है।</p>
          <p class="text-xs text-slate-500 max-w-sm mx-auto">नीचे अपना सवाल पूछें। एआई तुरंत सटीक जवाब देगा और मानवीकृत स्वर में बोलकर बताएगा भी।</p>
        </div>
      </div>

      <!-- स्मार्ट नेक्स्ट-स्टेप्स -->
      <div id="nextStepsRow" class="hidden mt-3 pt-3 border-t border-slate-200 flex flex-wrap gap-2 flex-shrink-0">
        <button onclick="injectNext('इसे और अधिक विस्तार से समझाओ')" class="action-btn text-xs px-3 py-1.5 rounded-xl text-indigo-700 font-medium">
          🚀 इसे विस्तार दें
        </button>
        <button onclick="injectNext('इसमें क्या तकनीकी कमियाँ हैं, उन्हें सुधारो')" class="action-btn text-xs px-3 py-1.5 rounded-xl text-indigo-700 font-medium">
          ⚙️ तकनीकी सुधार
        </button>
      </div>
    </section>

    <!-- इनपुट कंट्रोल डेक -->
    <section class="glass-box p-3.5 rounded-3xl relative shadow-lg flex-shrink-0 mb-1">
      <div id="voiceWaveBar" class="hidden pb-2 px-2 flex items-center space-x-1.5 justify-center">
        <span class="text-[11px] font-mono text-indigo-600 mr-2 font-bold">आवाज़ सुन रहा हूँ...</span>
        <div class="w-1 bg-indigo-600 voice-wave rounded-full" style="animation-delay: 0.1s"></div>
        <div class="w-1 bg-indigo-600 voice-wave rounded-full" style="animation-delay: 0.3s"></div>
        <div class="w-1 bg-indigo-600 voice-wave rounded-full" style="animation-delay: 0.2s"></div>
      </div>

      <div class="flex items-end space-x-2.5">
        <div class="flex-1 relative">
          <textarea id="promptBox" rows="2" placeholder="यहाँ कुछ भी पूछें... (मानवीकृत स्वर और ऑटो-स्पीक सक्रिय)" class="w-full bg-white text-sm sm:text-base text-slate-900 placeholder-slate-400 rounded-2xl p-3.5 focus:outline-none border border-slate-200 focus:border-indigo-600 resize-none transition shadow-inner"></textarea>
        </div>
        <button onclick="toggleVoiceInput()" id="micBtn" class="action-btn h-12 w-12 rounded-2xl text-slate-700 flex items-center justify-center transition flex-shrink-0 text-base">
          <i class="fa-solid fa-microphone"></i>
        </button>
        <button onclick="executeEngine()" class="h-12 w-12 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center transition shadow-md shadow-indigo-500/30 flex-shrink-0 text-base">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());

    const BACKEND_URL = "https://khaascore-ai-backend-1.onrender.com";
    let recognition = null;
    let speechSynth = window.speechSynthesis;
    let currentUtterance = null;

    const canvas = document.getElementById('neuralCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.radius = 1.5;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#4f46e5';
        ctx.fill();
      }
    }

    for (let i = 0; i < 30; i++) particles.push(new Particle());

    function animateNeural() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(79, 70, 229, ${1 - dist / 120})`;
            ctx.lineWidth = 0.4;
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animateNeural);
    }
    animateNeural();

    function triggerThinking(active) {
      const state = document.getElementById('thinkingState');
      const out = document.getElementById('outputConsole');
      if (active) {
        state.classList.remove('hidden');
        out.classList.add('hidden');
      } else {
        state.classList.add('hidden');
        out.classList.remove('hidden');
      }
    }

    // 🌟 अत्यंत मधुर और प्राकृतिक मानवीकृत स्वर (Natural Human Voice)
    function speakHumanVoice(text) {
      if (!speechSynth) return;
      speechSynth.cancel();

      const cleanText = text.replace(/[*#_`]/g, '').trim();
      currentUtterance = new SpeechSynthesisUtterance(cleanText);
      currentUtterance.lang = 'hi-IN';
      currentUtterance.rate = 0.95; // शांत और स्पष्ट गति
      currentUtterance.pitch = 1.0; // प्राकृतिक टोन

      const voices = speechSynth.getVoices();
      const humanVoice = voices.find(v => v.lang.includes('hi') || v.lang.includes('IN')) || voices[0];
      if (humanVoice) currentUtterance.voice = humanVoice;

      speechSynth.speak(currentUtterance);
    }

    function stopHumanVoice() {
      if (speechSynth) speechSynth.cancel();
    }

    async function executeEngine() {
      stopHumanVoice();
      const input = document.getElementById('promptBox');
      const prompt = input.value.trim();
      if (!prompt) return;

      const output = document.getElementById('outputConsole');
      const nextSteps = document.getElementById('nextStepsRow');

      nextSteps.classList.add('hidden');
      output.textContent = '';
      triggerThinking(true);

      const endpoints = [
        `${BACKEND_URL}/api/generate/stream`,
        "https://khaascore-ai-backend-1.onrender.com/api/generate/stream"
      ];

      let success = false;
      let fullResponseText = "";

      for (const endpoint of endpoints) {
        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer guest_token' },
            body: JSON.stringify({ prompt: prompt, tool: 'general', persona: 'shark' })
          });

          if (!res.ok) continue;

          triggerThinking(false);
          success = true;
          const reader = res.body.getReader();
          const decoder = new TextDecoder('utf-8');

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value);
            const lines = chunk.split('\n');
            for (const line of lines) {
              if (line.startsWith('data: ')) {
                try {
                  const parsed = JSON.parse(line.replace('data: ', ''));
                  if (parsed.type === 'stream_chunk') {
                    const textChunk = parsed.payload.chunk;
                    output.textContent += textChunk;
                    fullResponseText += textChunk;
                  }
                  if (parsed.type === 'error') {
                    output.textContent = parsed.payload.message;
                    fullResponseText = parsed.payload.message;
                  }
                } catch(e) {}
              }
            }
          }
          break;
        } catch (err) {}
      }

      if (!success) {
        triggerThinking(false);
        const fallbackMsg = "न्यूरल क्लस्टर री-कनेक्ट हो रहा है... कृपया एक सेकंड रुककर दोबारा कमांड दें।";
        output.textContent = fallbackMsg;
        speakHumanVoice(fallbackMsg);
      } else {
        nextSteps.classList.remove('hidden');
        speakHumanVoice(fullResponseText);
      }
    }

    function injectNext(text) {
      document.getElementById('promptBox').value = text;
      executeEngine();
    }

    function toggleVoiceInput() {
      const wave = document.getElementById('voiceWaveBar');
      const micBtn = document.getElementById('micBtn');

      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('वॉयस इनपुट समर्थित नहीं है।');
        return;
      }

      if (recognition && recognition.running) {
        recognition.stop();
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.continuous = false;

      recognition.onstart = () => {
        recognition.running = true;
        wave.classList.remove('hidden');
        micBtn.classList.add('text-indigo-600', 'border-indigo-600');
      };
      recognition.onresult = (e) => {
        document.getElementById('promptBox').value = e.results[0][0].transcript;
      };
      recognition.onend = () => {
        recognition.running = false;
        wave.classList.add('hidden');
        micBtn.classList.remove('text-indigo-600', 'border-indigo-600');
      };
      recognition.start();
    }

    function toggleTeleprompter() {
      const out = document.getElementById('outputConsole');
      out.classList.toggle('teleprompter-active');
      if (out.classList.contains('teleprompter-active')) {
        window.teleScroll = setInterval(() => { out.scrollTop += 1; }, 35);
      } else {
        clearInterval(window.teleScroll);
      }
    }

    function replayVoice() {
      const text = document.getElementById('outputConsole').textContent;
      if (text) speakHumanVoice(text);
    }

    function copyOutput() {
      navigator.clipboard.writeText(document.getElementById('outputConsole').textContent);
      alert('क्लिपबोर्ड में कॉपी किया गया!');
    }
  </script>
</body>
</html>
