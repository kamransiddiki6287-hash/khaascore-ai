            p.y += p.vy;
            if (p.x < 0 || p.x > w) p.vx *= -1;
            if (p.y < 0 || p.y > h) p.vy *= -1;

              if (dist < 115) {

                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);

              }
            }

          h = canvas.height = window.innerHeight;

                    className="w-full relative group overflow-hidden rounded-2xl p-[1px] active:scale-[0.98] transition-transform"
                  >
                    <div className="absolute inset-0 bg-gradient-to-r from-emerald-500 via-teal-400 to-cyan-500 rounded-2xl blur-[1px] opacity-85 group-hover:opacity-100 transition-opacity" />
                    <div className="relative px-5 py-4 bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-700 hover:from-emerald-500 hover:to-cyan-600 rounded-2xl flex items-center justify-center gap-2.5 text-white font-mono shadow-xl shadow-emerald-950/50">
                      {isAuditing ? (
                        <div className="flex items-center gap-2 text-xs font-bold animate-pulse">
                          <span>⚡ [STAGE {auditStep}/4] CRYPTOGRAPHICALLY SIGNING AUDIT...</span>
                        </div>
                      ) : (
                        <>
                          <span className="text-base">📄</span>
                          <span className="text-xs sm:text-sm font-bold tracking-wider uppercase">
                            Download Executive Board PDF Report
                          </span>
                        </>
                      )}
                    </div>
                  </button>
                </section>
              </>
            ) : (
              <section className="space-y-4">
                <div className="text-center space-y-1">
                  <h3 className="text-lg font-black tracking-tight text-white font-mono">
                    ENTERPRISE SAAS TIERS
                  </h3>
                  <p className="text-xs text-slate-400">
                    Statutory AI Governance for US, UK & Canadian Enterprises.
                  </p>
                </div>

                <div className="space-y-3.5">
                  {pricingPlans.map((plan, idx) => (
                    <div
                      key={idx}
                      className={`relative bg-[#060e22]/90 border rounded-2xl p-5 backdrop-blur-xl transition-all duration-300 ${
                        plan.popular
                          ? 'border-emerald-400/60 shadow-xl shadow-emerald-950/40'
                          : 'border-slate-800 hover:border-slate-700'
                      }`}
                    >
                      {plan.popular && (
                        <div className="absolute -top-3 right-4 bg-gradient-to-r from-emerald-500 to-teal-500 text-black font-mono text-[9px] font-extrabold px-3 py-0.5 rounded-full shadow-lg">
                          MOST POPULAR IN US/UK
                        </div>
                      )}

                      <div className="flex justify-between items-baseline mb-2">
                        <h4 className="text-sm font-bold text-white font-mono">{plan.name}</h4>
                        <div className="flex items-baseline">
                          <span className="text-2xl font-black font-mono text-emerald-400">{plan.price}</span>
                          <span className="text-xs text-slate-400 font-mono">{plan.period}</span>
                        </div>
                      </div>

                      <p className="text-xs text-slate-400 mb-4">{plan.description}</p>

                      <ul className="space-y-2 mb-5 text-xs text-slate-300 font-mono">
                        {plan.features.map((feat, fIdx) => (
                          <li key={fIdx} className="flex items-center gap-2">
                            <span className="text-emerald-400">✓</span> {feat}
                          </li>
                        ))}
                      </ul>

                      <button
                        onClick={() => alert(`Redirecting to Stripe USD Checkout for ${plan.name}...`)}
                        className={`w-full py-3 rounded-xl font-mono text-xs font-bold tracking-wider uppercase transition-all ${
                          plan.popular
                            ? 'bg-gradient-to-r from-emerald-500 to-teal-500 text-black shadow-lg shadow-emerald-500/20 hover:opacity-90'
                            : 'bg-slate-900 text-slate-200 border border-slate-700 hover:bg-slate-800'
                        }`}
                      >
                        {plan.buttonText}
                      </button>
                    </div>
                  ))}
                </div>
              </section>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
